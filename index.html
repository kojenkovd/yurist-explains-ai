<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02132f">
  <meta name="description" content="Юрист объясняет | AI — юридический помощник в Telegram">
  <title>Юрист объясняет | AI</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <div class="bg"></div><div class="bgShade"></div><div class="glow glowA"></div><div class="glow glowB"></div>
  <header class="top glass">
    <button class="brandBtn" data-screen="home" aria-label="На главную">
      <span class="brandIcon">⚖</span><span class="brandText"><small>ЮРИСТ ОБЪЯСНЯЕТ</small><b>AI-помощник</b></span>
    </button>
    <button class="avatar" data-screen="profile" aria-label="Профиль"><span>Д</span></button>
  </header>

  <main id="view" class="view"></main>

  <nav class="nav glass" id="nav">
    <button data-screen="home" class="active"><span>⌂</span><small>Главная</small></button>
    <button data-screen="documents"><span>▤</span><small>Документы</small></button>
    <button data-screen="ai"><span>◉</span><small>AI</small></button>
    <button data-screen="xray"><span>✦</span><small>Рентген</small></button>
    <button data-screen="profile"><span>○</span><small>Профиль</small></button>
  </nav>
</div>

<div id="sheet" class="sheet" aria-hidden="true"><div class="sheetBackdrop" data-close></div><section class="sheetPanel" role="dialog" aria-modal="true"><button class="close" data-close>×</button><div id="sheetBody"></div></section></div>
<div id="toast" class="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
